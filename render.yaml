services:
  - type: web
    name: despensa-web
    runtime: static
    rootDir: frontend
    buildCommand: npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        value: https://app-compras-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
